<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Layane</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ease-out-expo: cubic-bezier(0.16,1,0.3,1); }

    #pageLayer {
      opacity: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── INTRO ── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      pointer-events: all;
    }

    #introCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #introName {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      font-family: Inter, sans-serif;
      font-size: 36px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: -0.01em;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(
        160deg,
        #ffffff 0%, #e4f2fa 12%, #b0ccd8 26%,
        #607880 42%, #0e1618 54%, #486070 66%,
        #a8c8d6 78%, #eef8ff 90%, #c0d8e4 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: opacity 1.2s ease, transform 1.2s var(--ease-out-expo);
    }

    #introName.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 48px; box-sizing: border-box;
      background: rgba(0,0,0,0.85); z-index: 1000;
    }
    .logo { perspective: 800px; }
    .logo img {
      height: 96px; width: auto; display: block;
      transition: transform 1.5s ease; transform-style: preserve-3d;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo img:hover { transform: rotateY(360deg); }
    @keyframes logoPulse {
      0%   { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
      50%  { filter: drop-shadow(0 0 40px rgba(200,220,255,1)) drop-shadow(0 0 80px rgba(160,200,255,0.9)) drop-shadow(0 0 120px rgba(120,180,255,0.8)); }
      100% { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
    }
    nav { display: flex; align-items: center; gap: 36px; }
    nav a { color: white; text-decoration: none; font-family: Inter, sans-serif; font-size: 24px; transition: opacity 0.2s ease; }
    nav a:hover { opacity: 0.6; }

    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 6px; width: 40px; height: 40px; cursor: pointer; background: none; border: none; padding: 0; z-index: 1100; }
    .hamburger span { display: block; height: 2px; background: white; border-radius: 2px; transition: transform 0.35s var(--ease-out-expo), opacity 0.25s ease; }
    .hamburger span:nth-child(1) { width: 28px; }
    .hamburger span:nth-child(2) { width: 20px; }
    .hamburger span:nth-child(3) { width: 24px; }
    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); width: 28px; }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); width: 28px; }

    .mobile-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 1050; flex-direction: column; align-items: center; justify-content: center; gap: 36px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .mobile-menu.open { opacity: 1; pointer-events: all; }
    .mobile-menu a { font-family: Inter, sans-serif; font-size: 32px; font-weight: 700; color: white; text-decoration: none; opacity: 0; transform: translateY(18px); transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo); }
    .mobile-menu.open a { opacity: 1; transform: translateY(0); }
    .mobile-menu.open a:nth-child(1) { transition-delay: 0.05s; }
    .mobile-menu.open a:nth-child(2) { transition-delay: 0.10s; }
    .mobile-menu.open a:nth-child(3) { transition-delay: 0.15s; }
    .mobile-menu.open a:nth-child(4) { transition-delay: 0.20s; }
    .mobile-menu.open a:nth-child(5) { transition-delay: 0.25s; }
    .mobile-menu.open a:nth-child(6) { transition-delay: 0.30s; }
    .mobile-menu a:hover { opacity: 0.6 !important; }

    main { flex: 1; padding: 180px 40px 60px; box-sizing: border-box; }
    .home-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .home-name { font-size: 36px; font-weight: 700; margin-bottom: 30px; color: white; cursor: pointer; transition: opacity 0.2s ease; }
    .home-name:hover { opacity: 0.7; }
    .home-photo { width: 520px; max-width: 100%; height: auto; border-radius: 14px; margin-bottom: 0; }
    .home-tagline { font-size: 36px; font-weight: 700; margin-bottom: 0; color: white; }

    .marquee-wrap { width: 100vw; margin-left: calc(-50vw + 50%); overflow: hidden; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 0; margin-top: 48px; margin-bottom: 48px; }
    .marquee-track { display: flex; animation: marqueeScroll 20s linear infinite; white-space: nowrap; }
    .marquee-track span { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 28px; }
    .marquee-track span.sep { color: rgba(255,255,255,0.12); padding: 0; letter-spacing: 0; }
    @keyframes marqueeScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .info-grid { display: flex; justify-content: center; gap: 140px; margin-top: 20px; }
    .contact-block, .social-block { text-align: center; }
    .contact-block h3, .social-block h3 { font-size: 24px; margin-bottom: 18px; }
    .contact-info { font-size: 18px; margin-bottom: 6px; }
    .contact-info a { color: white; text-decoration: none; }
    .contact-info a:hover { opacity: 0.7; }
    .social-links { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .social-links img { width: 48px; height: 48px; transition: transform 0.3s var(--ease-out-expo), filter 0.3s ease; }
    .social-links img:hover { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 0 8px rgba(200,230,255,0.7)); }
    .contact-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0; }
    .contact-row img { width: 32px; height: 32px; }
    .contact-row a { color: white; text-decoration: underline; font-size: 18px; }
    .contact-row a:hover { opacity: 0.7; }
    footer { text-align: center; padding: 20px 40px; font-size: 16px; opacity: 0.6; }

    .reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo); }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-stagger > * { opacity: 0; transform: translateY(24px); transition: opacity 0.65s var(--ease-out-expo), transform 0.65s var(--ease-out-expo); }
    .reveal-stagger.visible > *:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.05s; }
    .reveal-stagger.visible > *:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.2s; }

    @media (max-width: 768px) {
      header { padding: 20px 24px; }
      nav { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }
      main { padding: 160px 24px 60px; }
      .home-photo { width: 300px; }
      .info-grid { gap: 48px; flex-direction: column; align-items: center; }
      .home-name { font-size: 28px; }
      .home-tagline { font-size: 24px; }
    }
  </style>
</head>

  <script>
  // ── MARQUEE ──
  const marqueeItems = ['Aayush Layane','About','Experiences','Gateway','Interests','Year in Review'];
  const track = document.getElementById('marqueeTrack');
  let mhtml = '';
  for (let c = 0; c < 2; c++) marqueeItems.forEach(i => { mhtml += `<span>${i}</span><span class="sep">✦</span>`; });
  track.innerHTML = mhtml;

  // ══════════════════════════════════════════════════════════
  //  WEBGL MERCURY METABALL FLUID INTRO
  // ══════════════════════════════════════════════════════════
  // ══════════════════════════════════════════════════════════
  //  LIQUID METAL SWEEP INTRO
  // ══════════════════════════════════════════════════════════
  (function () {
    const introEl = document.getElementById('intro');
    const nameEl  = document.getElementById('introName');
    const pageEl  = document.getElementById('pageLayer');
    const canvas  = document.getElementById('introCanvas');
    const homeName = document.getElementById('homeName');

    const gl = canvas.getContext('webgl', {
      antialias: true,
      alpha: false,
      premultipliedAlpha: false
    });

    if (!gl) {
      introEl.style.display = 'none';
      pageEl.style.opacity = '1';
      return;
    }

    let W = window.innerWidth;
    let H = window.innerHeight;
    let DPR = Math.min(window.devicePixelRatio || 1, 1.5);

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 1.5);

      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';

      gl.viewport(0, 0, canvas.width, canvas.height);
      syncIntroNamePosition();
    }

    function syncIntroNamePosition() {
      const rect = homeName.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      nameEl.style.left = `${cx}px`;
      nameEl.style.top = `${cy}px`;
      nameEl.style.transform = 'translate(-50%, -50%) scale(0.92)';
    }

    resize();
    window.addEventListener('resize', resize);

    const VS = `
      attribute vec2 a_pos;
      varying vec2 v_uv;

      void main() {
        v_uv = a_pos * 0.5 + 0.5;
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }
    `;

    const FS = `
      precision highp float;
      varying vec2 v_uv;

      uniform vec2  u_res;
      uniform float u_time;
      uniform float u_progress;
      uniform float u_fade;
      uniform float u_aspect;

      float saturate(float x) {
        return clamp(x, 0.0, 1.0);
      }

      mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);

        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));

        vec2 u = f * f * (3.0 - 2.0 * f);

        return mix(a, b, u.x)
             + (c - a) * u.y * (1.0 - u.x)
             + (d - b) * u.x * u.y;
      }

      vec2 flowWarp(vec2 p, float t) {
        float n1 = noise(p * 2.2 + vec2(t * 0.10, -t * 0.08));
        float n2 = noise((p + 4.0) * 3.8 + vec2(-t * 0.12, t * 0.06));

        p.x += (n1 - 0.5) * 0.10;
        p.y += (n2 - 0.5) * 0.08;

        p += vec2(
          sin(p.y * 5.5 + t * 1.2) * 0.028,
          sin(p.x * 4.2 - t * 0.95) * 0.022
        );

        return p;
      }

      vec2 segInfo(vec2 p, vec2 a, vec2 b) {
        vec2 pa = p - a;
        vec2 ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        vec2 q = a + ba * h;
        return vec2(length(p - q), h);
      }

      vec2 pathPoint(float t) {
        vec2 p0 = vec2(-1.22,  0.98); // top left
        vec2 p1 = vec2(-0.92, -0.18); // middle bottom left
        vec2 p2 = vec2( 0.38, -0.22); // middle bottom right
        vec2 p3 = vec2( 0.92,  0.78); // right top
        vec2 p4 = vec2( 0.00,  0.18); // middle

        if (t < 0.25) {
          float s = t / 0.25;
          return mix(p0, p1, s);
        } else if (t < 0.55) {
          float s = (t - 0.25) / 0.30;
          return mix(p1, p2, s);
        } else if (t < 0.78) {
          float s = (t - 0.55) / 0.23;
          return mix(p2, p3, s);
        } else {
          float s = (t - 0.78) / 0.22;
          return mix(p3, p4, s);
        }
      }

      float ribbonField(vec2 p, float widthMul, float offsetAmt, float softness, float revealLead) {
        vec2 p0 = vec2(-1.22,  0.98);
        vec2 p1 = vec2(-0.92, -0.18);
        vec2 p2 = vec2( 0.38, -0.22);
        vec2 p3 = vec2( 0.92,  0.78);
        vec2 p4 = vec2( 0.00,  0.18);

        p0.x *= u_aspect; p1.x *= u_aspect; p2.x *= u_aspect; p3.x *= u_aspect; p4.x *= u_aspect;

        float minDist = 1e5;

        vec2 a, b, info;
        float startT, endT, gT;
        float width;
        float pulse;
        vec2 dir, nrm;

        // segment 1
        a = p0; b = p1;
        dir = normalize(b - a);
        nrm = vec2(-dir.y, dir.x);
        a += nrm * offsetAmt;
        b += nrm * offsetAmt;
        info = segInfo(p, a, b);
        gT = mix(0.0, 0.25, info.y);
        width = mix(0.26, 0.19, info.y) * widthMul;
        pulse = 1.0 + 0.12 * sin(gT * 18.0 - u_time * 2.0);
        if (gT <= u_progress + revealLead) minDist = min(minDist, info.x - width * pulse);

        // segment 2
        a = p1; b = p2;
        dir = normalize(b - a);
        nrm = vec2(-dir.y, dir.x);
        a += nrm * offsetAmt;
        b += nrm * offsetAmt;
        info = segInfo(p, a, b);
        gT = mix(0.25, 0.55, info.y);
        width = mix(0.20, 0.24, info.y) * widthMul;
        pulse = 1.0 + 0.11 * sin(gT * 20.0 - u_time * 2.4);
        if (gT <= u_progress + revealLead) minDist = min(minDist, info.x - width * pulse);

        // segment 3
        a = p2; b = p3;
        dir = normalize(b - a);
        nrm = vec2(-dir.y, dir.x);
        a += nrm * offsetAmt;
        b += nrm * offsetAmt;
        info = segInfo(p, a, b);
        gT = mix(0.55, 0.78, info.y);
        width = mix(0.18, 0.14, info.y) * widthMul;
        pulse = 1.0 + 0.10 * sin(gT * 22.0 - u_time * 2.1);
        if (gT <= u_progress + revealLead) minDist = min(minDist, info.x - width * pulse);

        // segment 4
        a = p3; b = p4;
        dir = normalize(b - a);
        nrm = vec2(-dir.y, dir.x);
        a += nrm * offsetAmt;
        b += nrm * offsetAmt;
        info = segInfo(p, a, b);
        gT = mix(0.78, 1.0, info.y);
        width = mix(0.14, 0.10, info.y) * widthMul;
        pulse = 1.0 + 0.08 * sin(gT * 24.0 - u_time * 2.7);
        if (gT <= u_progress + revealLead) minDist = min(minDist, info.x - width * pulse);

        return minDist - softness;
      }

      float scene(vec2 p) {
        vec2 q = p;
        q.x *= u_aspect;
        q = flowWarp(q, u_time);

        float mainSheet  = ribbonField(q, 1.00,  0.00, 0.000, 0.06);
        float upperSheet = ribbonField(q, 0.72,  0.13, 0.010, 0.09);
        float lowerSheet = ribbonField(q, 0.86, -0.17, 0.012, 0.10);
        float fineSheet  = ribbonField(q, 0.45,  0.27, 0.020, 0.12);

        float d = min(min(mainSheet, upperSheet), min(lowerSheet, fineSheet));

        vec2 focus = pathPoint(min(u_progress, 1.0));
        focus.x *= u_aspect;

        float takeover = smoothstep(0.0, 0.45, u_progress);
        float glowSweep = length(q - focus) - mix(0.45, 0.80, takeover);
        d = min(d, glowSweep + 0.20);

        return d;
      }

      vec3 chromeColor(vec2 p, vec2 n, float edge, float inside) {
        vec3 viewDir = normalize(vec3(0.0, 0.0, 1.0));
        vec3 normal  = normalize(vec3(-n.x * 1.0, -n.y * 1.0, 0.72));

        vec3 lightA = normalize(vec3(-0.75, 0.72, 0.88));
        vec3 lightB = normalize(vec3( 0.95, 0.10, 0.60));
        vec3 lightC = normalize(vec3(-0.08,-0.95, 0.30));

        float diffA = max(dot(normal, lightA), 0.0);
        float diffB = max(dot(normal, lightB), 0.0);
        float diffC = max(dot(normal, lightC), 0.0);

        vec3 refl = reflect(-viewDir, normal);

        float env =
            0.50
          + 0.28 * sin(refl.y * 17.0 + refl.x * 8.0)
          + 0.16 * sin(refl.y * 34.0 - refl.x * 11.0)
          + 0.08 * sin(refl.x * 52.0 + refl.y * 14.0);

        env = saturate(env);

        float specA = pow(max(dot(normalize(lightA + viewDir), normal), 0.0), 140.0);
        float specB = pow(max(dot(normalize(lightB + viewDir), normal), 0.0), 90.0);
        float specC = pow(max(dot(normalize(lightC + viewDir), normal), 0.0), 40.0);

        float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.3);

        vec3 shadow = vec3(0.015, 0.018, 0.022);
        vec3 mid    = vec3(0.34, 0.36, 0.39);
        vec3 bright = vec3(0.95, 0.96, 0.98);

        vec3 col = mix(shadow, mid, env);
        col = mix(col, bright, diffA * 0.90 + diffB * 0.42);
        col += specA * vec3(1.0);
        col += specB * vec3(0.98, 0.99, 1.0) * 0.95;
        col += specC * vec3(0.75, 0.80, 0.86) * 0.40;
        col += fresnel * vec3(0.26, 0.28, 0.31) * 0.95;
        col += edge * vec3(0.22, 0.23, 0.25);

        float seam = 0.5 + 0.5 * sin((p.x + p.y) * 18.0 + u_time * 1.8);
        col *= mix(0.86, 1.14, seam);

        float streaks = 0.5 + 0.5 * sin((p.x * 28.0 - p.y * 14.0) - u_time * 2.8);
        col += streaks * 0.10 * inside;

        return col;
      }

      void main() {
        vec2 uv = v_uv * 2.0 - 1.0;
        uv.y *= u_res.y / u_res.x;

        float d = scene(uv);

        float aa = 0.012;
        float inside = smoothstep(aa, -aa, d);

        if (inside < 0.001) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }

        float dx = scene(uv + vec2(0.003, 0.0)) - d;
        float dy = scene(uv + vec2(0.0, 0.003)) - d;
        vec2 n = normalize(vec2(dx, dy) + vec2(0.0001));

        float edge = 1.0 - smoothstep(-0.08, 0.02, d);
        vec3 col = chromeColor(uv, n, edge, inside);

        float sweepHighlight = smoothstep(0.15, -0.25, d);
        col += sweepHighlight * vec3(0.18, 0.19, 0.20);

        col *= (1.0 - u_fade);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    function compile(type, src) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }

      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(program);
    gl.useProgram(program);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(
      gl.ARRAY_BUFFER,
      new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
      gl.STATIC_DRAW
    );

    const aPos = gl.getAttribLocation(program, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const uRes      = gl.getUniformLocation(program, 'u_res');
    const uTime     = gl.getUniformLocation(program, 'u_time');
    const uProgress = gl.getUniformLocation(program, 'u_progress');
    const uFade     = gl.getUniformLocation(program, 'u_fade');
    const uAspect   = gl.getUniformLocation(program, 'u_aspect');

    let animId = null;
    let startTime = null;

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function easeOutExpo(t) {
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    const SWEEP_END   = 3000;
    const NAME_START  = 2550;
    const PAGE_START  = 3000;
    const FADE_START  = 3900;
    const FADE_END    = 5100;

    function render(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const sec = elapsed / 1000;

      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      const progress = easeInOutCubic(clamp(elapsed / SWEEP_END, 0, 1));
      const fade = easeOutExpo(clamp((elapsed - FADE_START) / (FADE_END - FADE_START), 0, 1));

      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, sec);
      gl.uniform1f(uProgress, progress);
      gl.uniform1f(uFade, fade);
      gl.uniform1f(uAspect, canvas.width / canvas.height);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      if (elapsed > NAME_START) {
        nameEl.classList.add('show');
        nameEl.style.transform = 'translate(-50%, -50%) scale(1)';
      }

      if (elapsed > PAGE_START) {
        const pageProgress = clamp((elapsed - PAGE_START) / (FADE_END - PAGE_START), 0, 1);
        pageEl.style.opacity = String(easeOutExpo(pageProgress));
      }

      if (elapsed > FADE_START) {
        const bgFade = clamp((elapsed - FADE_START) / (FADE_END - FADE_START), 0, 1);
        introEl.style.background = `rgba(0,0,0,${(1 - easeOutExpo(bgFade)).toFixed(3)})`;
      }

      if (elapsed >= FADE_END) {
        introEl.style.display = 'none';
        cancelAnimationFrame(animId);
        return;
      }

      animId = requestAnimationFrame(render);
    }

    function startIntro() {
      syncIntroNamePosition();
      startTime = null;
      nameEl.classList.remove('show');
      nameEl.style.transform = 'translate(-50%, -50%) scale(0.92)';
      introEl.style.display = 'block';
      introEl.style.background = '#000';
      pageEl.style.opacity = '0';

      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(render);
    }

    startIntro();
    homeName.addEventListener('click', startIntro);
  })();
    
  // ── HAMBURGER ──
  const hamburger  = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    hamburger.classList.toggle('open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  });
  mobileMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      hamburger.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  // ── SCROLL REVEAL ──
  const revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
  const observer  = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => observer.observe(el));
  </script>
</body>
