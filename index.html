<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Layane</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ease-out-expo: cubic-bezier(0.16,1,0.3,1); }

    /* ─────────────────────────
       PAGE LAYER (fades in under intro)
    ───────────────────────── */
    #pageLayer {
      opacity: 0;
      transition: opacity 0s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ─────────────────────────
       INTRO OVERLAY
    ───────────────────────── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: all;
      background: #000;
    }

    #introCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Name lives inside intro, positioned at same place as real name */
    #introName {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: Inter, sans-serif;
      font-size: 36px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: -0.01em;
      opacity: 0;
      pointer-events: none;
      /* chrome text matching the fluid */
      background: linear-gradient(
        160deg,
        #ffffff   0%,
        #e4f2fa  12%,
        #b0ccd8  26%,
        #607880  42%,
        #0e1618  54%,
        #486070  66%,
        #a8c8d6  78%,
        #eef8ff  90%,
        #c0d8e4 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      /* match real home-name size */
    }

    /* ─────────────────────────
       HEADER
    ───────────────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 48px; box-sizing: border-box;
      background: rgba(0,0,0,0.85); z-index: 1000;
    }
    .logo { perspective: 800px; }
    .logo img {
      height: 96px; width: auto; display: block;
      transition: transform 1.5s ease; transform-style: preserve-3d;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo img:hover { transform: rotateY(360deg); }
    @keyframes logoPulse {
      0%   { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
      50%  { filter: drop-shadow(0 0 40px rgba(200,220,255,1)) drop-shadow(0 0 80px rgba(160,200,255,0.9)) drop-shadow(0 0 120px rgba(120,180,255,0.8)); }
      100% { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
    }
    nav { display: flex; align-items: center; gap: 36px; }
    nav a { color: white; text-decoration: none; font-family: Inter, sans-serif; font-size: 24px; transition: opacity 0.2s ease; }
    nav a:hover { opacity: 0.6; }

    /* ── HAMBURGER ── */
    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 6px; width: 40px; height: 40px; cursor: pointer; background: none; border: none; padding: 0; z-index: 1100; }
    .hamburger span { display: block; height: 2px; background: white; border-radius: 2px; transition: transform 0.35s var(--ease-out-expo), opacity 0.25s ease; }
    .hamburger span:nth-child(1) { width: 28px; }
    .hamburger span:nth-child(2) { width: 20px; }
    .hamburger span:nth-child(3) { width: 24px; }
    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); width: 28px; }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); width: 28px; }

    /* ── MOBILE MENU ── */
    .mobile-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 1050; flex-direction: column; align-items: center; justify-content: center; gap: 36px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .mobile-menu.open { opacity: 1; pointer-events: all; }
    .mobile-menu a { font-family: Inter, sans-serif; font-size: 32px; font-weight: 700; color: white; text-decoration: none; opacity: 0; transform: translateY(18px); transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo); }
    .mobile-menu.open a { opacity: 1; transform: translateY(0); }
    .mobile-menu.open a:nth-child(1) { transition-delay: 0.05s; }
    .mobile-menu.open a:nth-child(2) { transition-delay: 0.10s; }
    .mobile-menu.open a:nth-child(3) { transition-delay: 0.15s; }
    .mobile-menu.open a:nth-child(4) { transition-delay: 0.20s; }
    .mobile-menu.open a:nth-child(5) { transition-delay: 0.25s; }
    .mobile-menu.open a:nth-child(6) { transition-delay: 0.30s; }
    .mobile-menu a:hover { opacity: 0.6 !important; }

    /* ── MAIN ── */
    main { flex: 1; padding: 180px 40px 60px; box-sizing: border-box; }
    .home-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .home-name { font-size: 36px; font-weight: 700; margin-bottom: 30px; color: white; cursor: pointer; transition: opacity 0.2s ease; }
    .home-name:hover { opacity: 0.7; }
    .home-photo { width: 520px; max-width: 100%; height: auto; border-radius: 14px; margin-bottom: 0; }
    .home-tagline { font-size: 36px; font-weight: 700; margin-bottom: 0; color: white; }

    /* ── MARQUEE ── */
    .marquee-wrap { width: 100vw; margin-left: calc(-50vw + 50%); overflow: hidden; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 0; margin-top: 48px; margin-bottom: 48px; }
    .marquee-track { display: flex; animation: marqueeScroll 20s linear infinite; white-space: nowrap; }
    .marquee-track span { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 28px; }
    .marquee-track span.sep { color: rgba(255,255,255,0.12); padding: 0; letter-spacing: 0; }
    @keyframes marqueeScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* ── INFO GRID ── */
    .info-grid { display: flex; justify-content: center; gap: 140px; margin-top: 20px; }
    .contact-block, .social-block { text-align: center; }
    .contact-block h3, .social-block h3 { font-size: 24px; margin-bottom: 18px; }
    .contact-info { font-size: 18px; margin-bottom: 6px; }
    .contact-info a { color: white; text-decoration: none; }
    .contact-info a:hover { opacity: 0.7; }
    .social-links { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .social-links img { width: 48px; height: 48px; transition: transform 0.3s var(--ease-out-expo), filter 0.3s ease; }
    .social-links img:hover { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 0 8px rgba(200,230,255,0.7)); }
    .contact-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0; }
    .contact-row img { width: 32px; height: 32px; }
    .contact-row a { color: white; text-decoration: underline; font-size: 18px; }
    .contact-row a:hover { opacity: 0.7; }
    footer { text-align: center; padding: 20px 40px; font-size: 16px; opacity: 0.6; }

    /* ── SCROLL REVEAL ── */
    .reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo); }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-stagger > * { opacity: 0; transform: translateY(24px); transition: opacity 0.65s var(--ease-out-expo), transform 0.65s var(--ease-out-expo); }
    .reveal-stagger.visible > *:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.05s; }
    .reveal-stagger.visible > *:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.2s; }

    @media (max-width: 768px) {
      header { padding: 20px 24px; }
      nav { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }
      main { padding: 160px 24px 60px; }
      .home-photo { width: 300px; }
      .info-grid { gap: 48px; flex-direction: column; align-items: center; }
      .home-name { font-size: 28px; }
      .home-tagline { font-size: 24px; }
    }
  </style>
</head>

  <script>
  // ── MARQUEE ──
  const marqueeItems = ['Aayush Layane','About','Experiences','Gateway','Interests','Year in Review'];
  const track = document.getElementById('marqueeTrack');
  let mhtml = '';
  for (let c = 0; c < 2; c++) marqueeItems.forEach(i => { mhtml += `<span>${i}</span><span class="sep">✦</span>`; });
  track.innerHTML = mhtml;

  // ══════════════════════════════════════════════════════════
  //  MERCURY FLUID INTRO
  //  — Metaballs with chrome radial-gradient shading
  //  — Flows top-left → bottom-mid → center
  //  — Name materialises from the fluid
  //  — Page fades in underneath while fluid still moves
  // ══════════════════════════════════════════════════════════
  (function () {
    const introEl  = document.getElementById('intro');
    const nameEl   = document.getElementById('introName');
    const pageEl   = document.getElementById('pageLayer');
    const canvas   = document.getElementById('introCanvas');
    const ctx      = canvas.getContext('2d');

    let W, H, cx, cy;
    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W / 2; cy = H / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Bezier path: top-left → bottom-mid → center ──
    function evalBez(t) {
      // P0=top-left, P1=pull far left+down, P2=bottom-mid, P3=center
      const p0 = { x: 0.0,  y: 0.02 };
      const p1 = { x: 0.05, y: 0.9  };
      const p2 = { x: 0.6,  y: 1.0  };
      const p3 = { x: 0.5,  y: 0.5  };
      const mt = 1 - t;
      return {
        x: (mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x) * W,
        y: (mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y) * H,
      };
    }

    // ── Metaball system ──
    // Each ball has position, radius, and a "path t" tracking its progress
    const balls = [];

    // Spawn a new ball along the path at position t
    function spawnBall(pathT, radiusMult) {
      const pos = evalBez(pathT);
      // Add organic wobble
      const wobble = 18 * (1 - pathT * 0.5);
      balls.push({
        x:    pos.x + (Math.random() - 0.5) * wobble,
        y:    pos.y + (Math.random() - 0.5) * wobble,
        tx:   pos.x, // target
        ty:   pos.y,
        r:    (55 + Math.random() * 45) * radiusMult,
        vx:   (Math.random() - 0.5) * 0.6,
        vy:   (Math.random() - 0.5) * 0.6,
        life: 1.0,
        decay: 0.0, // controlled externally
        pathT,
      });
    }

    // ── Chrome radial gradient for a single metaball ──
    function drawChromeBall(x, y, r, alpha) {
      if (r < 1) return;

      // Outer glow — dark mercury shadow
      const glow = ctx.createRadialGradient(x, y, r * 0.0, x, y, r * 1.4);
      glow.addColorStop(0,   `rgba(140,158,165,${alpha * 0.12})`);
      glow.addColorStop(0.6, `rgba(80,100,110,${alpha * 0.06})`);
      glow.addColorStop(1.0, `rgba(0,0,0,0)`);
      ctx.beginPath();
      ctx.arc(x, y, r * 1.4, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      // Main body — dark-to-bright chrome radial
      // Offset highlight toward top-left (light source direction)
      const hx = x - r * 0.28;
      const hy = y - r * 0.32;
      const body = ctx.createRadialGradient(hx, hy, r * 0.05, x, y, r);
      body.addColorStop(0.00, `rgba(255,255,255,${alpha * 0.98})`);  // mirror white
      body.addColorStop(0.08, `rgba(220,235,242,${alpha * 0.95})`);  // icy silver
      body.addColorStop(0.22, `rgba(165,188,198,${alpha * 0.90})`);  // light steel
      body.addColorStop(0.42, `rgba(90,115,125,${alpha * 0.85})`);   // mid chrome
      body.addColorStop(0.62, `rgba(28,38,44,${alpha * 0.92})`);     // deep shadow
      body.addColorStop(0.78, `rgba(15,22,26,${alpha * 0.95})`);     // near black
      body.addColorStop(0.90, `rgba(55,80,90,${alpha * 0.80})`);     // reflected ground
      body.addColorStop(1.00, `rgba(100,125,135,${alpha * 0.40})`);  // rim light

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = body;
      ctx.fill();

      // Secondary specular — small bright flare (reflection of key light)
      const sx  = x - r * 0.18;
      const sy  = y - r * 0.20;
      const sr  = r * 0.28;
      const spec = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      spec.addColorStop(0.0, `rgba(255,255,255,${alpha * 0.85})`);
      spec.addColorStop(0.5, `rgba(230,243,250,${alpha * 0.35})`);
      spec.addColorStop(1.0, `rgba(200,225,238,0)`);
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fillStyle = spec;
      ctx.fill();

      // Tiny sharp specular dot
      const dot = ctx.createRadialGradient(x - r*0.32, y - r*0.38, 0, x - r*0.32, y - r*0.38, r * 0.08);
      dot.addColorStop(0,   `rgba(255,255,255,${alpha * 0.95})`);
      dot.addColorStop(1,   `rgba(255,255,255,0)`);
      ctx.beginPath();
      ctx.arc(x - r*0.32, y - r*0.38, r * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = dot;
      ctx.fill();

      // Bottom rim reflection (ground bounce)
      const rim = ctx.createRadialGradient(x + r*0.1, y + r*0.72, 0, x + r*0.1, y + r*0.72, r * 0.38);
      rim.addColorStop(0,   `rgba(160,195,210,${alpha * 0.40})`);
      rim.addColorStop(1,   `rgba(100,140,158,0)`);
      ctx.beginPath();
      ctx.arc(x + r*0.1, y + r*0.72, r * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = rim;
      ctx.fill();
    }

    // ── Timing (ms) ──
    const FLOW_END        = 3000;  // fluid finishes travelling path
    const NAME_FADE_START = 2800;  // name starts emerging
    const NAME_FADE_END   = 4000;  // name fully visible
    const PAGE_FADE_START = 3200;  // page starts revealing underneath
    const FLUID_FADE_START= 4000;  // fluid starts evaporating
    const FLUID_FADE_END  = 5400;  // fluid fully gone → intro removed

    let startTime = null;
    let animId    = null;
    let lastSpawn = 0;
    let flowProgress = 0; // 0→1 along the bezier path

    function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }
    function easeOut(t)   { return 1 - Math.pow(1-t, 3); }
    function clamp(v,a,b) { return Math.max(a, Math.min(b, v)); }

    function loop(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;

      // Clear with full black each frame — the chrome look
      // comes from layered gradients per ball, not trail smearing
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      // ── 1. Advance flow and spawn new balls ──
      flowProgress = Math.min(easeInOut(elapsed / FLOW_END), 1.0);

      if (elapsed < FLOW_END + 400) {
        const spawnInterval = 38; // ms between spawns
        if (elapsed - lastSpawn > spawnInterval) {
          lastSpawn = elapsed;
          // Spawn cluster at current path position
          const clusterSize = 3 + Math.floor(flowProgress * 4);
          for (let i = 0; i < clusterSize; i++) {
            const jitter = (Math.random() - 0.5) * 0.05;
            spawnBall(clamp(flowProgress + jitter, 0, 1), 0.8 + flowProgress * 0.5);
          }
          // Also seed a few balls slightly behind for density
          for (let i = 0; i < 2; i++) {
            const behind = clamp(flowProgress - Math.random() * 0.15, 0, 1);
            spawnBall(behind, 0.6 + flowProgress * 0.4);
          }
        }
      }

      // ── 2. Update ball physics ──
      const fluidFadeT = elapsed > FLUID_FADE_START
        ? clamp((elapsed - FLUID_FADE_START) / (FLUID_FADE_END - FLUID_FADE_START), 0, 1)
        : 0;

      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Gentle drift toward path target
        b.vx += (b.tx - b.x) * 0.012;
        b.vy += (b.ty - b.y) * 0.012;

        // Cohesion — balls attract each other slightly
        for (let j = 0; j < balls.length; j++) {
          if (i === j) continue;
          const dx = balls[j].x - b.x;
          const dy = balls[j].y - b.y;
          const dist = Math.sqrt(dx*dx + dy*dy) + 0.001;
          if (dist < (b.r + balls[j].r) * 1.6) {
            b.vx += dx / dist * 0.04;
            b.vy += dy / dist * 0.04;
          }
        }

        b.vx *= 0.88;
        b.vy *= 0.88;
        b.x  += b.vx;
        b.y  += b.vy;

        // Shrink and fade during fluid evaporation
        if (fluidFadeT > 0) {
          b.r   *= (1 - fluidFadeT * 0.018);
          b.life = 1 - fluidFadeT;
        }

        if (b.r < 2 || b.life <= 0) { balls.splice(i, 1); }
      }

      // ── 3. Draw all chrome balls ──
      // Sort back to front by radius for better layering
      const sorted = [...balls].sort((a, b) => b.r - a.r);
      for (const b of sorted) {
        drawChromeBall(b.x, b.y, b.r, b.life);
      }

      // ── 4. Name emergence ──
      if (elapsed > NAME_FADE_START) {
        const nt = clamp((elapsed - NAME_FADE_START) / (NAME_FADE_END - NAME_FADE_START), 0, 1);
        nameEl.style.opacity = String(easeOut(nt));
        // subtle scale — grows from 0.9 to 1 as it materialises
        const sc = 0.90 + easeOut(nt) * 0.10;
        nameEl.style.transform = `translate(-50%, -50%) scale(${sc})`;
      }

      // ── 5. Page fade-in underneath ──
      if (elapsed > PAGE_FADE_START) {
        const pt = clamp((elapsed - PAGE_FADE_START) / (FLUID_FADE_END - PAGE_FADE_START), 0, 1);
        pageEl.style.opacity = String(easeOut(pt));
      }

      // ── 6. Intro overlay evaporation ──
      if (elapsed > FLUID_FADE_START) {
        // Fade the black background of the intro out — reveals page under
        const ft = clamp((elapsed - FLUID_FADE_START) / (FLUID_FADE_END - FLUID_FADE_START), 0, 1);
        introEl.style.background = `rgba(0,0,0,${1 - easeOut(ft)})`;
      }

      // ── 7. Done ──
      if (elapsed > FLUID_FADE_END) {
        introEl.style.display = 'none';
        cancelAnimationFrame(animId);
        return;
      }

      animId = requestAnimationFrame(loop);
    }

    function startIntro() {
      startTime = null; lastSpawn = 0; flowProgress = 0;
      balls.length = 0;
      ctx.clearRect(0, 0, W, H);
      nameEl.style.opacity   = '0';
      nameEl.style.transform = 'translate(-50%, -50%) scale(0.90)';
      introEl.style.display  = 'block';
      introEl.style.background = '#000';
      pageEl.style.opacity   = '0';
      pageEl.style.transition = 'none';
      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    startIntro();

    document.getElementById('homeName').addEventListener('click', startIntro);
  })();

  // ── HAMBURGER ──
  const hamburger  = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    hamburger.classList.toggle('open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  });
  mobileMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      hamburger.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  // ── SCROLL REVEAL ──
  const revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
  const observer  = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => observer.observe(el));
  </script>
</body>
</html>
