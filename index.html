<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Layane</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="styles.css">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── HEADER (original size restored) ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      box-sizing: border-box;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
    }

    .logo { perspective: 800px; }
    .logo img {
      height: 96px;
      width: auto;
      display: block;
      transition: transform 1.5s ease;
      transform-style: preserve-3d;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo img:hover { transform: rotateY(360deg); }

    @keyframes logoPulse {
      0%   { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
      50%  { filter: drop-shadow(0 0 40px rgba(200,220,255,1)) drop-shadow(0 0 80px rgba(160,200,255,0.9)) drop-shadow(0 0 120px rgba(120,180,255,0.8)); }
      100% { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
    }

    nav {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-family: Inter, sans-serif;
      font-size: 24px;
      transition: opacity 0.2s ease;
    }

    nav a:hover { opacity: 0.6; }

    /* ── HAMBURGER ── */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      z-index: 1100;
    }

    .hamburger span {
      display: block;
      height: 2px;
      background: white;
      border-radius: 2px;
      transition: transform 0.35s var(--ease-out-expo), opacity 0.25s ease;
    }

    .hamburger span:nth-child(1) { width: 28px; }
    .hamburger span:nth-child(2) { width: 20px; }
    .hamburger span:nth-child(3) { width: 24px; }

    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); width: 28px; }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); width: 28px; }

    /* ── MOBILE MENU ── */
    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.97);
      z-index: 1050;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .mobile-menu.open {
      opacity: 1;
      pointer-events: all;
    }

    .mobile-menu a {
      font-family: Inter, sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: white;
      text-decoration: none;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo);
    }

    .mobile-menu a:hover {
      background: linear-gradient(90deg, #aac8de, #ffffff, #8aaabb, #ffffff, #aac8de);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .mobile-menu.open a { opacity: 1; transform: translateY(0); }
    .mobile-menu.open a:nth-child(1) { transition-delay: 0.05s; }
    .mobile-menu.open a:nth-child(2) { transition-delay: 0.10s; }
    .mobile-menu.open a:nth-child(3) { transition-delay: 0.15s; }
    .mobile-menu.open a:nth-child(4) { transition-delay: 0.20s; }
    .mobile-menu.open a:nth-child(5) { transition-delay: 0.25s; }
    .mobile-menu.open a:nth-child(6) { transition-delay: 0.30s; }

    /* ── HOME CONTAINER ── */
    .home-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ── Y2K CHROME NAME ── */
    .home-name {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 30px;
      display: inline-block;

      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #d4e8f8 15%,
        #7aaabb 32%,
        #ffffff 48%,
        #b8d4ec 64%,
        #5a8899 78%,
        #e8f4ff 100%
      );
      background-size: 100% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      animation: chromeShimmer 3.5s ease-in-out infinite;
    }

    @keyframes chromeShimmer {
      0%   { background-position: 0% 0%; }
      50%  { background-position: 0% 100%; }
      100% { background-position: 0% 0%; }
    }

    /* ── PHOTO ── */
    .home-photo {
      width: 520px;
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      margin-bottom: 0;
      transition: filter 0.4s ease, transform 0.4s var(--ease-out-expo);
    }

    .home-photo:hover {
      filter: drop-shadow(0 0 20px rgba(180,220,255,0.65)) drop-shadow(0 0 50px rgba(140,190,240,0.35));
      transform: scale(1.012);
    }

    /* ── TAGLINE (travelling chrome shimmer) ── */
    .home-tagline {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 30px;
      display: inline-block;

      background: linear-gradient(
        90deg,
        #b0c8dc 0%,
        #ffffff 20%,
        #8aaabb 40%,
        #ffffff 60%,
        #b0c8dc 80%,
        #ffffff 100%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      animation: taglineSlide 4s linear infinite;
    }

    @keyframes taglineSlide {
      0%   { background-position: 0% 0%; }
      100% { background-position: 250% 0%; }
    }

    /* ── INFO GRID (unchanged structure) ── */
    .info-grid {
      display: flex;
      justify-content: center;
      gap: 140px;
      margin-top: 20px;
    }

    .contact-block, .social-block { text-align: center; }

    .contact-block h3, .social-block h3 {
      font-size: 24px;
      margin-bottom: 18px;
    }

    .contact-info {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .contact-info a { color: white; text-decoration: none; }
    .contact-info a:hover { opacity: 0.7; }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
    }

    .social-links img {
      width: 48px;
      height: 48px;
      transition: transform 0.3s var(--ease-out-expo), filter 0.3s ease;
    }

    .social-links img:hover {
      transform: translateY(-4px) scale(1.1);
      filter: drop-shadow(0 0 10px rgba(200,230,255,0.8));
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 0;
    }

    .contact-row img { width: 32px; height: 32px; }

    .contact-row a {
      color: white;
      text-decoration: underline;
      font-size: 18px;
    }

    .contact-row a:hover { opacity: 0.7; }

    footer {
      text-align: center;
      padding: 20px 40px;
      font-size: 16px;
      opacity: 0.6;
    }

    /* ══════════════════════════
       SCROLL REVEAL
    ══════════════════════════ */

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* stagger for info grid children */
    .reveal-stagger > * {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.65s var(--ease-out-expo), transform 0.65s var(--ease-out-expo);
    }

    .reveal-stagger.visible > *:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.05s; }
    .reveal-stagger.visible > *:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.2s; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      header { padding: 20px 24px; }
      nav { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }

      main { padding: 160px 24px 60px; }
      .home-photo { width: 300px; }
      .info-grid { gap: 48px; flex-direction: column; align-items: center; }
      .home-name { font-size: 28px; }
      .home-tagline { font-size: 24px; }
    }

  </style>
</head>
<body class="home">

  <!-- MOBILE MENU -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="experiences.html">Experiences</a>
    <a href="gateway.html">Gateway</a>

  </div>

  <header>
    <div class="logo">
      <a href="index.html">
        <img src="assets/logo.png" alt="Aayush Layane logo">
      </a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="experiences.html">Experiences</a>
      <a href="gateway.html">Gateway</a>
      <a href="interests.html">Interests</a>
      <a href="yearinreview.html">Year in Review</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main>
    <div class="home-container">

      <h1 class="home-name reveal">Aayush Layane</h1>

      <div class="reveal">
        <img src="assets/myphoto.jpg" alt="Aayush Layane" class="home-photo">

      <h2 class="home-tagline reveal">Welcome to my WRLD!!</h2>

      <div class="contact-section">

  <footer>
    <p>© 2026 Aayush Layane</p>
  </footer>

  <script>
    // ── HAMBURGER ──
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        hamburger.classList.remove('open');
        document.body.style.overflow = '';
      });
    });

    // ── SCROLL REVEAL ──
    const revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    revealEls.forEach(el => observer.observe(el));
  </script>

</body>
