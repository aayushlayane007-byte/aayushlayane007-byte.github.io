<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Layane</title>
  <link rel="preconnect" href="https://rsms.me/">

  <link rel="stylesheet" href="styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ease-out-expo: cubic-bezier(0.16,1,0.3,1); }

    #pageLayer {
      opacity: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── INTRO ── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      pointer-events: all;
    }

    #introCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #introName {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      font-family: Inter, sans-serif;
      font-size: 36px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: -0.01em;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(
        160deg,
        #ffffff 0%, #e4f2fa 12%, #b0ccd8 26%,
        #607880 42%, #0e1618 54%, #486070 66%,
        #a8c8d6 78%, #eef8ff 90%, #c0d8e4 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: opacity 1.2s ease, transform 1.2s var(--ease-out-expo);
    }

    #introName.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 48px; box-sizing: border-box;
      background: rgba(0,0,0,0.85); z-index: 1000;
    }
    .logo { perspective: 800px; }
    .logo img {
      height: 96px; width: auto; display: block;
      transition: transform 1.5s ease; transform-style: preserve-3d;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo img:hover { transform: rotateY(360deg); }
    @keyframes logoPulse {
      0%   { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
      50%  { filter: drop-shadow(0 0 40px rgba(200,220,255,1)) drop-shadow(0 0 80px rgba(160,200,255,0.9)) drop-shadow(0 0 120px rgba(120,180,255,0.8)); }
      100% { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
    }
    nav { display: flex; align-items: center; gap: 36px; }
    nav a { color: white; text-decoration: none; font-family: Inter, sans-serif; font-size: 24px; transition: opacity 0.2s ease; }
    nav a:hover { opacity: 0.6; }

    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 6px; width: 40px; height: 40px; cursor: pointer; background: none; border: none; padding: 0; z-index: 1100; }
    .hamburger span { display: block; height: 2px; background: white; border-radius: 2px; transition: transform 0.35s var(--ease-out-expo), opacity 0.25s ease; }
    .hamburger span:nth-child(1) { width: 28px; }
    .hamburger span:nth-child(2) { width: 20px; }
    .hamburger span:nth-child(3) { width: 24px; }
    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); width: 28px; }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); width: 28px; }

    .mobile-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 1050; flex-direction: column; align-items: center; justify-content: center; gap: 36px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .mobile-menu.open { opacity: 1; pointer-events: all; }
    .mobile-menu a { font-family: Inter, sans-serif; font-size: 32px; font-weight: 700; color: white; text-decoration: none; opacity: 0; transform: translateY(18px); transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo); }
    .mobile-menu.open a { opacity: 1; transform: translateY(0); }
    .mobile-menu.open a:nth-child(1) { transition-delay: 0.05s; }
    .mobile-menu.open a:nth-child(2) { transition-delay: 0.10s; }
    .mobile-menu.open a:nth-child(3) { transition-delay: 0.15s; }
    .mobile-menu.open a:nth-child(4) { transition-delay: 0.20s; }
    .mobile-menu.open a:nth-child(5) { transition-delay: 0.25s; }
    .mobile-menu.open a:nth-child(6) { transition-delay: 0.30s; }
    .mobile-menu a:hover { opacity: 0.6 !important; }

    main { flex: 1; padding: 180px 40px 60px; box-sizing: border-box; }
    .home-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .home-name { font-size: 36px; font-weight: 700; margin-bottom: 30px; color: white; cursor: pointer; transition: opacity 0.2s ease; }
    .home-name:hover { opacity: 0.7; }
    .home-photo { width: 520px; max-width: 100%; height: auto; border-radius: 14px; margin-bottom: 0; }
    .home-tagline { font-size: 36px; font-weight: 700; margin-bottom: 0; color: white; }

    .marquee-wrap { width: 100vw; margin-left: calc(-50vw + 50%); overflow: hidden; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 0; margin-top: 48px; margin-bottom: 48px; }
    .marquee-track { display: flex; animation: marqueeScroll 20s linear infinite; white-space: nowrap; }
    .marquee-track span { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 28px; }
    .marquee-track span.sep { color: rgba(255,255,255,0.12); padding: 0; letter-spacing: 0; }
    @keyframes marqueeScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .info-grid { display: flex; justify-content: center; gap: 140px; margin-top: 20px; }
    .contact-block, .social-block { text-align: center; }
    .contact-block h3, .social-block h3 { font-size: 24px; margin-bottom: 18px; }
    .contact-info { font-size: 18px; margin-bottom: 6px; }
    .contact-info a { color: white; text-decoration: none; }
    .contact-info a:hover { opacity: 0.7; }
    .social-links { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .social-links img { width: 48px; height: 48px; transition: transform 0.3s var(--ease-out-expo), filter 0.3s ease; }
    .social-links img:hover { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 0 8px rgba(200,230,255,0.7)); }
    .contact-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0; }
    .contact-row img { width: 32px; height: 32px; }
    .contact-row a { color: white; text-decoration: underline; font-size: 18px; }
    .contact-row a:hover { opacity: 0.7; }
    footer { text-align: center; padding: 20px 40px; font-size: 16px; opacity: 0.6; }

    .reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo); }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-stagger > * { opacity: 0; transform: translateY(24px); transition: opacity 0.65s var(--ease-out-expo), transform 0.65s var(--ease-out-expo); }
    .reveal-stagger.visible > *:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.05s; }
    .reveal-stagger.visible > *:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.2s; }

    @media (max-width: 768px) {
      header { padding: 20px 24px; }
      nav { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }
      main { padding: 160px 24px 60px; }
      .home-photo { width: 300px; }
      .info-grid { gap: 48px; flex-direction: column; align-items: center; }
      .home-name { font-size: 28px; }
      .home-tagline { font-size: 24px; }
    }
  </style>

  <script>
  // ── MARQUEE ──
  const marqueeItems = ['Aayush Layane','About','Experiences','Gateway','Interests','Year in Review'];
  const track = document.getElementById('marqueeTrack');
  let mhtml = '';
  for (let c = 0; c < 2; c++) marqueeItems.forEach(i => { mhtml += `<span>${i}</span><span class="sep">✦</span>`; });
  track.innerHTML = mhtml;

  // ══════════════════════════════════════════════════════════
  //  WEBGL MERCURY METABALL FLUID INTRO
  // ══════════════════════════════════════════════════════════
  (function () {
    const introEl = document.getElementById('intro');
    const nameEl  = document.getElementById('introName');
    const pageEl  = document.getElementById('pageLayer');
    const canvas  = document.getElementById('introCanvas');

    const gl = canvas.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false });
    if (!gl) { introEl.style.display = 'none'; pageEl.style.opacity = '1'; return; }

    let W = window.innerWidth, H = window.innerHeight;

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      gl.viewport(0, 0, W, H);
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Vertex shader ── (fullscreen quad)
    const VS = `
      attribute vec2 a_pos;
      varying vec2 v_uv;
      void main() {
        v_uv = a_pos * 0.5 + 0.5;
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }
    `;

    // ── Fragment shader ── real metaball field + chrome shading
    const FS = `
      precision highp float;
      varying vec2 v_uv;

      uniform vec2  u_res;
      uniform float u_time;
      uniform float u_aspect;
      uniform float u_fade;      // 0=opaque intro, 1=fully faded

      // Up to 28 metaballs: xy=pos (normalised 0..1), z=radius, w=active(0/1)
      uniform vec3 u_balls[28];

      void main() {
        vec2 uv = v_uv;
        uv.x *= u_aspect;

        // ── Compute metaball field ──
        float field = 0.0;
        // also track weighted normal for shading
        vec2  grad  = vec2(0.0);

        for (int i = 0; i < 28; i++) {
          vec2  bpos = u_balls[i].xy;
          bpos.x    *= u_aspect;
          float brad  = u_balls[i].z;
          if (brad < 0.001) continue;

          vec2  d    = uv - bpos;
          float r2   = dot(d, d);
          float r    = sqrt(r2) + 0.0001;
          float w    = (brad * brad) / (r2 + 0.0001);
          field     += w;
          // gradient contribution
          grad      -= d / (r2 * r2 + 0.0001) * brad * brad * 2.0;
        }

        // Threshold — this is where fluid merges/separates
        float threshold = 1.0;
        float inside    = smoothstep(threshold - 0.18, threshold + 0.18, field);

        if (inside < 0.001) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }

        // ── Chrome / mercury shading ──
        // Surface normal from gradient
        vec2  n2   = normalize(grad + vec2(0.0001));
        vec3  norm = normalize(vec3(n2.x, n2.y, sqrt(max(0.0, 1.0 - dot(n2,n2)))));

        // Key light: top-left
        vec3  light1 = normalize(vec3(-0.6, 0.8, 0.6));
        // Fill light: right
        vec3  light2 = normalize(vec3(0.8, 0.2, 0.5));
        // Back/rim: bottom
        vec3  light3 = normalize(vec3(0.0, -0.7, 0.4));

        float diff1  = max(dot(norm, light1), 0.0);
        float diff2  = max(dot(norm, light2), 0.0) * 0.4;
        float diff3  = max(dot(norm, light3), 0.0) * 0.25;

        // Specular — tight Blinn-Phong for mirror-like chrome
        vec3  viewDir = vec3(0.0, 0.0, 1.0);
        vec3  h1      = normalize(light1 + viewDir);
        vec3  h2      = normalize(light2 + viewDir);
        float spec1   = pow(max(dot(norm, h1), 0.0), 120.0);
        float spec2   = pow(max(dot(norm, h2), 0.0), 60.0) * 0.5;

        // Mercury palette: dark steel-blue in shadows, bright silver-white in light
        vec3 shadowCol  = vec3(0.04, 0.06, 0.09);   // near-black with blue tint
        vec3 midCol     = vec3(0.38, 0.46, 0.52);   // steel blue-grey
        vec3 brightCol  = vec3(0.88, 0.92, 0.96);   // icy silver
        vec3 specCol    = vec3(1.00, 1.00, 1.00);   // mirror white

        // Blend diffuse lighting into colour
        float light     = diff1 + diff2 + diff3;
        vec3  baseColor = mix(shadowCol, mix(midCol, brightCol, diff1), light);

        // Add specular on top
        vec3  color     = baseColor + spec1 * specCol + spec2 * brightCol * 0.6;

        // Rim — subtle blue rim from bottom
        float rim       = pow(1.0 - max(dot(norm, viewDir), 0.0), 3.0);
        color          += rim * vec3(0.08, 0.14, 0.22) * 0.6;

        // Edge softness — fade at the boundary
        color          *= inside;

        // Subtle animated inner shimmer (time-based ripple in surface)
        float shimmer  = sin(dot(uv, vec2(8.0, 12.0)) + u_time * 2.5) * 0.03;
        color          += shimmer * brightCol * inside;

        // Fade out the fluid
        float alpha    = inside * (1.0 - u_fade);

        gl_FragColor   = vec4(mix(vec3(0.0), color, alpha), 1.0);
      }
    `;

    // ── Compile shaders ──
    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    // Fullscreen quad
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    // Uniform locations
    const uRes    = gl.getUniformLocation(prog, 'u_res');
    const uTime   = gl.getUniformLocation(prog, 'u_time');
    const uAspect = gl.getUniformLocation(prog, 'u_aspect');
    const uFade   = gl.getUniformLocation(prog, 'u_fade');
    const uBalls  = gl.getUniformLocation(prog, 'u_balls[0]');

    // ── Metaball definitions ──
    // Each ball travels a path segment. We define waypoints and timing.
    // Path: top-left → snake down-left → curve right across bottom → sweep up to center
    // 28 balls total, staggered spawn times along the path

    const NUM_BALLS = 28;

    // Bezier path waypoints (normalised 0..1 coords)
    // The fluid snakes: TL → bottom-left → bottom-right → center
    function pathPos(t) {
      // Segment 1: 0..0.35 — top-left down to bottom-left
      // Segment 2: 0.35..0.70 — bottom-left sweep right across bottom
      // Segment 3: 0.70..1.0 — sweep up-right to center
      if (t < 0.35) {
        const s = t / 0.35;
        const ease = s * s * (3 - 2 * s);
        return {
          x: 0.02 + ease * 0.12,
          y: 0.0  + ease * 0.88,
        };
      } else if (t < 0.70) {
        const s = (t - 0.35) / 0.35;
        const ease = s * s * (3 - 2 * s);
        // cubic bezier across bottom
        const p0x = 0.14, p0y = 0.88;
        const p1x = 0.25, p1y = 1.05; // dip below
        const p2x = 0.75, p2y = 1.05;
        const p3x = 0.88, p3y = 0.85;
        const mt = 1 - ease;
        return {
          x: mt*mt*mt*p0x + 3*mt*mt*ease*p1x + 3*mt*ease*ease*p2x + ease*ease*ease*p3x,
          y: mt*mt*mt*p0y + 3*mt*mt*ease*p1y + 3*mt*ease*ease*p2y + ease*ease*ease*p3y,
        };
      } else {
        const s = (t - 0.70) / 0.30;
        const ease = s * s * (3 - 2 * s);
        // sweep from bottom-right up to center
        const p0x = 0.88, p0y = 0.85;
        const p1x = 0.80, p1y = 0.30;
        const p2x = 0.65, p2y = 0.45;
        const p3x = 0.50, p3y = 0.50;
        const mt = 1 - ease;
        return {
          x: mt*mt*mt*p0x + 3*mt*mt*ease*p1x + 3*mt*ease*ease*p2x + ease*ease*ease*p3x,
          y: mt*mt*mt*p0y + 3*mt*mt*ease*p1y + 3*mt*ease*ease*p2y + ease*ease*ease*p3y,
        };
      }
    }

    // Ball state
    const ballData = [];
    for (let i = 0; i < NUM_BALLS; i++) {
      const spawnDelay = (i / NUM_BALLS) * 3400; // staggered over 3.4s
      const pathOffset = i / NUM_BALLS;           // each starts at different path position
      const rad = 0.055 + Math.random() * 0.055;  // normalised radius
      const wobX = (Math.random() - 0.5) * 0.06;
      const wobY = (Math.random() - 0.5) * 0.06;
      const wobSpeed = 0.4 + Math.random() * 0.8;
      const wobPhase = Math.random() * Math.PI * 2;
      ballData.push({ spawnDelay, pathOffset, rad, wobX, wobY, wobSpeed, wobPhase, alive: false });
    }

    // ── Timing ──
    const FLOW_DURATION   = 4200;  // total flow time
    const NAME_START      = 3200;
    const PAGE_START      = 3600;
    const FLUID_FADE_START= 4400;
    const FLUID_FADE_END  = 5800;

    let startTime = null;
    let animId    = null;

    function clamp(v,a,b) { return Math.max(a,Math.min(b,v)); }
    function easeOut(t)   { return 1 - Math.pow(1-t,3); }
    function easeInOut(t) { return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

    function loop(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const sec     = elapsed / 1000;

      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      // Set uniforms
      gl.uniform2f(uRes, W, H);
      gl.uniform1f(uTime, sec);
      gl.uniform1f(uAspect, W / H);

      // Fluid fade
      const fadeProg = elapsed > FLUID_FADE_START
        ? clamp((elapsed - FLUID_FADE_START) / (FLUID_FADE_END - FLUID_FADE_START), 0, 1)
        : 0;
      gl.uniform1f(uFade, easeOut(fadeProg));

      // Update and pack ball positions
      const ballArr = new Float32Array(NUM_BALLS * 3);
      for (let i = 0; i < NUM_BALLS; i++) {
        const b = ballData[i];

        if (elapsed < b.spawnDelay) {
          // not spawned yet — park off screen
          ballArr[i*3]   = -1.0;
          ballArr[i*3+1] = -1.0;
          ballArr[i*3+2] = 0.0;
          continue;
        }

        // How far along has this ball progressed on the path
        const age      = elapsed - b.spawnDelay;
        const pathT    = clamp(easeInOut(age / FLOW_DURATION), 0, 1);
        const pos      = pathPos(pathT);

        // Organic wobble
        const wobble   = Math.sin(sec * b.wobSpeed + b.wobPhase);
        const wobble2  = Math.cos(sec * b.wobSpeed * 1.3 + b.wobPhase + 1.2);

        let px = pos.x + b.wobX * wobble;
        let py = pos.y + b.wobY * wobble2;

        // Clamp to screen roughly
        px = clamp(px, -0.1, 1.1);
        py = clamp(py, -0.15, 1.15);

        // Shrink during fade
        const r = b.rad * (1.0 - fadeProg * 0.85);

        ballArr[i*3]   = px;
        ballArr[i*3+1] = 1.0 - py; // flip Y for GL convention
        ballArr[i*3+2] = r;
      }

      // Upload ball data as vec3 array
      for (let i = 0; i < NUM_BALLS; i++) {
        const loc = gl.getUniformLocation(prog, `u_balls[${i}]`);
        gl.uniform3f(loc, ballArr[i*3], ballArr[i*3+1], ballArr[i*3+2]);
      }

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // Name appearance
      if (elapsed > NAME_START) {
        nameEl.classList.add('show');
      }

      // Page fade in underneath
      if (elapsed > PAGE_START) {
        const pt = clamp((elapsed - PAGE_START) / (FLUID_FADE_END - PAGE_START), 0, 1);
        pageEl.style.opacity = String(easeOut(pt));
      }

      // Intro bg fade (so page shows through)
      if (elapsed > FLUID_FADE_START) {
        const ft = clamp((elapsed - FLUID_FADE_START) / (FLUID_FADE_END - FLUID_FADE_START), 0, 1);
        introEl.style.background = `rgba(0,0,0,${(1 - easeOut(ft)).toFixed(3)})`;
      }

      if (elapsed >= FLUID_FADE_END) {
        introEl.style.display = 'none';
        cancelAnimationFrame(animId);
        return;
      }

      animId = requestAnimationFrame(loop);
    }

    function startIntro() {
      startTime  = null;
      nameEl.classList.remove('show');
      introEl.style.display    = 'block';
      introEl.style.background = '#000';
      pageEl.style.opacity     = '0';
      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    startIntro();
    document.getElementById('homeName').addEventListener('click', startIntro);
  })();

  // ── HAMBURGER ──
  const hamburger  = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    hamburger.classList.toggle('open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  });
  mobileMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      hamburger.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  // ── SCROLL REVEAL ──
  const revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
  const observer  = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => observer.observe(el));
  </script>
</body>
</html>
