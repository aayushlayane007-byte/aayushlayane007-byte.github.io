<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Layane</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ease-out-expo: cubic-bezier(0.16,1,0.3,1); }

    #pageLayer {
      opacity: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── INTRO ── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      overflow: hidden;
    }

    #intro::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0.01) 18%, rgba(0,0,0,0) 52%);
      opacity: 0.9;
      pointer-events: none;
    }

    .intro-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transform: translateY(-6px);
    }

    #introName {
      font-family: Inter, sans-serif;
      font-size: 40px;
      font-style: italic;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(8px);
      color: rgba(255,255,255,0.96);
      text-shadow:
        0 0 10px rgba(255,255,255,0.10),
        0 0 24px rgba(255,255,255,0.05);
      transition:
        opacity 0.45s ease,
        transform 0.45s var(--ease-out-expo);
    }

    #introName.show {
      opacity: 1;
      transform: translateY(0);
    }

    .intro-lights {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
    }

    .start-light {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.08) 18%, rgba(255,255,255,0.02) 32%, rgba(0,0,0,0) 42%),
        radial-gradient(circle at center, rgba(255,70,70,0.98) 0%, rgba(200,0,0,0.94) 42%, rgba(80,0,0,0.95) 72%, rgba(10,10,10,1) 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        inset 0 -10px 18px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.06),
        0 0 26px rgba(255,0,0,0.12),
        0 0 50px rgba(255,0,0,0.08);
      opacity: 0.18;
      transform: scale(0.96);
      transition:
        opacity 0.22s ease,
        transform 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease;
    }

    .start-light.on {
      opacity: 1;
      transform: scale(1);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.10),
        inset 0 -10px 18px rgba(0,0,0,0.40),
        0 0 0 1px rgba(255,255,255,0.06),
        0 0 28px rgba(255,0,0,0.34),
        0 0 56px rgba(255,0,0,0.24),
        0 0 96px rgba(255,0,0,0.16);
    }

    .start-light.go {
      opacity: 1;
      transform: scale(1.02);
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.10) 18%, rgba(255,255,255,0.03) 32%, rgba(0,0,0,0) 42%),
        radial-gradient(circle at center, rgba(100,255,140,1) 0%, rgba(0,210,70,0.96) 44%, rgba(0,90,28,0.98) 74%, rgba(10,10,10,1) 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.10),
        inset 0 -10px 18px rgba(0,0,0,0.35),
        0 0 0 1px rgba(255,255,255,0.06),
        0 0 34px rgba(0,255,110,0.44),
        0 0 70px rgba(0,255,110,0.28),
        0 0 110px rgba(0,255,110,0.18);
    }

    .intro-flash {
      animation: introFlash 0.32s ease;
    }

    @keyframes introFlash {
      0%   { background: #000; }
      45%  { background: #041107; }
      100% { background: #000; }
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 48px; box-sizing: border-box;
      background: rgba(0,0,0,0.85); z-index: 1000;
    }
    .logo { perspective: 800px; }
    .logo img {
      height: 96px; width: auto; display: block;
      transition: transform 1.5s ease; transform-style: preserve-3d;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo img:hover { transform: rotateY(360deg); }
    @keyframes logoPulse {
      0%   { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
      50%  { filter: drop-shadow(0 0 40px rgba(200,220,255,1)) drop-shadow(0 0 80px rgba(160,200,255,0.9)) drop-shadow(0 0 120px rgba(120,180,255,0.8)); }
      100% { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
    }
    nav { display: flex; align-items: center; gap: 36px; }
    nav a { color: white; text-decoration: none; font-family: Inter, sans-serif; font-size: 24px; transition: opacity 0.2s ease; }
    nav a:hover { opacity: 0.6; }

    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 6px; width: 40px; height: 40px; cursor: pointer; background: none; border: none; padding: 0; z-index: 1100; }
    .hamburger span { display: block; height: 2px; background: white; border-radius: 2px; transition: transform 0.35s var(--ease-out-expo), opacity 0.25s ease; }
    .hamburger span:nth-child(1) { width: 28px; }
    .hamburger span:nth-child(2) { width: 20px; }
    .hamburger span:nth-child(3) { width: 24px; }
    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); width: 28px; }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); width: 28px; }

    .mobile-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 1050; flex-direction: column; align-items: center; justify-content: center; gap: 36px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .mobile-menu.open { opacity: 1; pointer-events: all; }
    .mobile-menu a { font-family: Inter, sans-serif; font-size: 32px; font-weight: 700; color: white; text-decoration: none; opacity: 0; transform: translateY(18px); transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo); }
    .mobile-menu.open a { opacity: 1; transform: translateY(0); }
    .mobile-menu.open a:nth-child(1) { transition-delay: 0.05s; }
    .mobile-menu.open a:nth-child(2) { transition-delay: 0.10s; }
    .mobile-menu.open a:nth-child(3) { transition-delay: 0.15s; }
    .mobile-menu.open a:nth-child(4) { transition-delay: 0.20s; }
    .mobile-menu.open a:nth-child(5) { transition-delay: 0.25s; }
    .mobile-menu.open a:nth-child(6) { transition-delay: 0.30s; }
    .mobile-menu a:hover { opacity: 0.6 !important; }

    main { flex: 1; padding: 180px 40px 60px; box-sizing: border-box; }
    .home-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .home-name { font-size: 36px; font-weight: 700; margin-bottom: 30px; color: white; cursor: pointer; transition: opacity 0.2s ease; }
    .home-name:hover { opacity: 0.7; }
    .home-photo { width: 520px; max-width: 100%; height: auto; border-radius: 14px; margin-bottom: 0; }
    .home-tagline { font-size: 36px; font-weight: 700; margin-bottom: 0; color: white; }

    .marquee-wrap { width: 100vw; margin-left: calc(-50vw + 50%); overflow: hidden; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 0; margin-top: 48px; margin-bottom: 48px; }
    .marquee-track { display: flex; animation: marqueeScroll 20s linear infinite; white-space: nowrap; }
    .marquee-track span { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 28px; }
    .marquee-track span.sep { color: rgba(255,255,255,0.12); padding: 0; letter-spacing: 0; }
    @keyframes marqueeScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .info-grid { display: flex; justify-content: center; gap: 140px; margin-top: 20px; }
    .contact-block, .social-block { text-align: center; }
    .contact-block h3, .social-block h3 { font-size: 24px; margin-bottom: 18px; }
    .contact-info { font-size: 18px; margin-bottom: 6px; }
    .contact-info a { color: white; text-decoration: none; }
    .contact-info a:hover { opacity: 0.7; }
    .social-links { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .social-links img { width: 48px; height: 48px; transition: transform 0.3s var(--ease-out-expo), filter 0.3s ease; }
    .social-links img:hover { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 0 8px rgba(200,230,255,0.7)); }
    .contact-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0; }
    .contact-row img { width: 32px; height: 32px; }
    .contact-row a { color: white; text-decoration: underline; font-size: 18px; }
    .contact-row a:hover { opacity: 0.7; }
    footer { text-align: center; padding: 20px 40px; font-size: 16px; opacity: 0.6; }

    .reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo); }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-stagger > * { opacity: 0; transform: translateY(24px); transition: opacity 0.65s var(--ease-out-expo), transform 0.65s var(--ease-out-expo); }
    .reveal-stagger.visible > *:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.05s; }
    .reveal-stagger.visible > *:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.2s; }

    @media (max-width: 768px) {
      header { padding: 20px 24px; }
      nav { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }
      main { padding: 160px 24px 60px; }
      .home-photo { width: 300px; }
      .info-grid { gap: 48px; flex-direction: column; align-items: center; }
      .home-name { font-size: 28px; }
      .home-tagline { font-size: 24px; }

      #introName {
        font-size: 24px;
        text-align: center;
        white-space: normal;
        max-width: 85vw;
      }

      .intro-lights {
        gap: 18px;
      }

      .start-light {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body class="home">

  <div id="intro">
    <div class="intro-content">
      <div id="introName">Lights out and away we go!</div>

      <div class="intro-lights" id="introLights" aria-hidden="true">
        <span class="start-light"></span>
        <span class="start-light"></span>
        <span class="start-light"></span>
      </div>
    </div>
  </div>

  <div id="pageLayer">
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="experiences.html">Experiences</a>
      <a href="gateway.html">Gateway</a>
      <a href="interests.html">Interests</a>
      <a href="yearinreview.html">Year in Review</a>
    </div>

    <header>
      <div class="logo">
        <a href="index.html"><img src="assets/logo.png" alt="Aayush Layane logo"></a>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="experiences.html">Experiences</a>
        <a href="gateway.html">Gateway</a>
        <a href="interests.html">Interests</a>
        <a href="yearinreview.html">Year in Review</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main>
      <div class="home-container">
        <h1 class="home-name" id="homeName">Aayush Layane</h1>
        <div><img src="assets/myphoto.jpg" alt="Aayush Layane" class="home-photo"></div>
        <h2 class="home-tagline">Welcome to my WRLD!!</h2>
        <div class="marquee-wrap">
          <div class="marquee-track" id="marqueeTrack"></div>
        </div>
        <div class="contact-section">
          <div class="info-grid">
            <div class="contact-block">
              <h3>Contact</h3>
              <div class="contact-info">
                <div class="contact-row">
                  <img src="assets/phone.png" alt="Phone">
                  <a href="tel:+15132238771">Phone</a>
                </div>
                <div class="contact-row">
                  <img src="assets/mail.png" alt="Email">
                  <a href="mailto:aayush.layane007@gmail.com">Mail</a>
                </div>
              </div>
            </div>
            <div class="social-block">
              <h3>Socials</h3>
              <div class="social-links">
                <a href="https://www.instagram.com/aayush._.999/" target="_blank"><img src="assets/instagram.png" alt="Instagram"></a>
                <a href="https://www.linkedin.com/feed/" target="_blank"><img src="assets/linkedin.png" alt="LinkedIn"></a>
                <a href="https://github.com/aayushlayane007-byte" target="_blank"><img src="assets/github.png" alt="GitHub"></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer><p>© 2026 Aayush Layane</p></footer>
  </div>

  <script>
  // ── MARQUEE ──
  const marqueeItems = ['Aayush Layane','About','Experiences','Gateway','Interests','Year in Review'];
  const track = document.getElementById('marqueeTrack');
  let mhtml = '';
  for (let c = 0; c < 2; c++) marqueeItems.forEach(i => { mhtml += `<span>${i}</span><span class="sep">✦</span>`; });
  track.innerHTML = mhtml;

  // ══════════════════════════════════════════════════════════
  //  F1 LIGHTS INTRO
  // ══════════════════════════════════════════════════════════
  (function () {
    const introEl = document.getElementById('intro');
    const nameEl = document.getElementById('introName');
    const pageEl = document.getElementById('pageLayer');
    const homeName = document.getElementById('homeName');
    const lights = Array.from(document.querySelectorAll('.start-light'));

    let timers = [];

    function clearIntroTimers() {
      timers.forEach(timer => clearTimeout(timer));
      timers = [];
    }

    function resetIntro() {
      clearIntroTimers();
      introEl.style.display = 'flex';
      introEl.style.opacity = '1';
      introEl.classList.remove('intro-flash');

      pageEl.style.opacity = '0';

      nameEl.classList.remove('show');

      lights.forEach(light => {
        light.classList.remove('on', 'go');
      });
    }

    function fadePageIn(duration = 1200) {
      const start = performance.now();

      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
        pageEl.style.opacity = String(eased);

        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }

      requestAnimationFrame(step);
    }

    function fadeIntroOut(duration = 850) {
      const start = performance.now();

      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        introEl.style.opacity = String(1 - progress);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          introEl.style.display = 'none';
          introEl.style.opacity = '1';
        }
      }

      requestAnimationFrame(step);
    }

    function startIntro() {
      resetIntro();

      timers.push(setTimeout(() => {
        lights[0].classList.add('on');
      }, 180));

      timers.push(setTimeout(() => {
        lights[1].classList.add('on');
      }, 520));

      timers.push(setTimeout(() => {
        lights[2].classList.add('on');
      }, 860));

      timers.push(setTimeout(() => {
        nameEl.classList.add('show');
      }, 1150));

      timers.push(setTimeout(() => {
        introEl.classList.add('intro-flash');
        lights.forEach(light => {
          light.classList.remove('on');
          light.classList.add('go');
        });
      }, 2950));

      timers.push(setTimeout(() => {
        fadePageIn(1200);
        fadeIntroOut(900);
      }, 3250));
    }

    startIntro();
    homeName.addEventListener('click', startIntro);
  })();

  // ── HAMBURGER ──
  const hamburger  = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    hamburger.classList.toggle('open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  });
  mobileMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      hamburger.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  // ── SCROLL REVEAL ──
  const revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
  const observer  = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => observer.observe(el));
  </script>
</body>
</html>
