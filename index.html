<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayush Layane</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ease-out-expo: cubic-bezier(0.16,1,0.3,1); }

    #pageLayer {
      opacity: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── INTRO ── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      pointer-events: all;
    }

    #introCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #introName {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      font-family: Inter, sans-serif;
      font-size: 36px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: -0.01em;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(
        160deg,
        #ffffff 0%, #e4f2fa 12%, #b0ccd8 26%,
        #607880 42%, #0e1618 54%, #486070 66%,
        #a8c8d6 78%, #eef8ff 90%, #c0d8e4 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: opacity 1.2s ease, transform 1.2s var(--ease-out-expo);
    }

    #introName.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 48px; box-sizing: border-box;
      background: rgba(0,0,0,0.85); z-index: 1000;
    }
    .logo { perspective: 800px; }
    .logo img {
      height: 96px; width: auto; display: block;
      transition: transform 1.5s ease; transform-style: preserve-3d;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo img:hover { transform: rotateY(360deg); }
    @keyframes logoPulse {
      0%   { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
      50%  { filter: drop-shadow(0 0 40px rgba(200,220,255,1)) drop-shadow(0 0 80px rgba(160,200,255,0.9)) drop-shadow(0 0 120px rgba(120,180,255,0.8)); }
      100% { filter: drop-shadow(0 0 0px rgba(220,230,255,0)); }
    }
    nav { display: flex; align-items: center; gap: 36px; }
    nav a { color: white; text-decoration: none; font-family: Inter, sans-serif; font-size: 24px; transition: opacity 0.2s ease; }
    nav a:hover { opacity: 0.6; }

    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 6px; width: 40px; height: 40px; cursor: pointer; background: none; border: none; padding: 0; z-index: 1100; }
    .hamburger span { display: block; height: 2px; background: white; border-radius: 2px; transition: transform 0.35s var(--ease-out-expo), opacity 0.25s ease; }
    .hamburger span:nth-child(1) { width: 28px; }
    .hamburger span:nth-child(2) { width: 20px; }
    .hamburger span:nth-child(3) { width: 24px; }
    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); width: 28px; }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); width: 28px; }

    .mobile-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 1050; flex-direction: column; align-items: center; justify-content: center; gap: 36px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .mobile-menu.open { opacity: 1; pointer-events: all; }
    .mobile-menu a { font-family: Inter, sans-serif; font-size: 32px; font-weight: 700; color: white; text-decoration: none; opacity: 0; transform: translateY(18px); transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo); }
    .mobile-menu.open a { opacity: 1; transform: translateY(0); }
    .mobile-menu.open a:nth-child(1) { transition-delay: 0.05s; }
    .mobile-menu.open a:nth-child(2) { transition-delay: 0.10s; }
    .mobile-menu.open a:nth-child(3) { transition-delay: 0.15s; }
    .mobile-menu.open a:nth-child(4) { transition-delay: 0.20s; }
    .mobile-menu.open a:nth-child(5) { transition-delay: 0.25s; }
    .mobile-menu.open a:nth-child(6) { transition-delay: 0.30s; }
    .mobile-menu a:hover { opacity: 0.6 !important; }

    main { flex: 1; padding: 180px 40px 60px; box-sizing: border-box; }
    .home-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .home-name { font-size: 36px; font-weight: 700; margin-bottom: 30px; color: white; cursor: pointer; transition: opacity 0.2s ease; }
    .home-name:hover { opacity: 0.7; }
    .home-photo { width: 520px; max-width: 100%; height: auto; border-radius: 14px; margin-bottom: 0; }
    .home-tagline { font-size: 36px; font-weight: 700; margin-bottom: 0; color: white; }

    .marquee-wrap { width: 100vw; margin-left: calc(-50vw + 50%); overflow: hidden; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 0; margin-top: 48px; margin-bottom: 48px; }
    .marquee-track { display: flex; animation: marqueeScroll 20s linear infinite; white-space: nowrap; }
    .marquee-track span { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 28px; }
    .marquee-track span.sep { color: rgba(255,255,255,0.12); padding: 0; letter-spacing: 0; }
    @keyframes marqueeScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .info-grid { display: flex; justify-content: center; gap: 140px; margin-top: 20px; }
    .contact-block, .social-block { text-align: center; }
    .contact-block h3, .social-block h3 { font-size: 24px; margin-bottom: 18px; }
    .contact-info { font-size: 18px; margin-bottom: 6px; }
    .contact-info a { color: white; text-decoration: none; }
    .contact-info a:hover { opacity: 0.7; }
    .social-links { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .social-links img { width: 48px; height: 48px; transition: transform 0.3s var(--ease-out-expo), filter 0.3s ease; }
    .social-links img:hover { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 0 8px rgba(200,230,255,0.7)); }
    .contact-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0; }
    .contact-row img { width: 32px; height: 32px; }
    .contact-row a { color: white; text-decoration: underline; font-size: 18px; }
    .contact-row a:hover { opacity: 0.7; }
    footer { text-align: center; padding: 20px 40px; font-size: 16px; opacity: 0.6; }

    .reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo); }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-stagger > * { opacity: 0; transform: translateY(24px); transition: opacity 0.65s var(--ease-out-expo), transform 0.65s var(--ease-out-expo); }
    .reveal-stagger.visible > *:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.05s; }
    .reveal-stagger.visible > *:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.2s; }

    @media (max-width: 768px) {
      header { padding: 20px 24px; }
      nav { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }
      main { padding: 160px 24px 60px; }
      .home-photo { width: 300px; }
      .info-grid { gap: 48px; flex-direction: column; align-items: center; }
      .home-name { font-size: 28px; }
      .home-tagline { font-size: 24px; }
    }
  </style>
</head>

  <script>
  // ── MARQUEE ──
  const marqueeItems = ['Aayush Layane','About','Experiences','Gateway','Interests','Year in Review'];
  const track = document.getElementById('marqueeTrack');
  let mhtml = '';
  for (let c = 0; c < 2; c++) marqueeItems.forEach(i => { mhtml += `<span>${i}</span><span class="sep">✦</span>`; });
  track.innerHTML = mhtml;

  // ══════════════════════════════════════════════════════════
  //  WEBGL MERCURY METABALL FLUID INTRO
  // ══════════════════════════════════════════════════════════
  // ══════════════════════════════════════════════════════════
  //  LIQUID METAL CURRENT INTRO
  // ══════════════════════════════════════════════════════════
  (function () {
    const introEl = document.getElementById('intro');
    const nameEl = document.getElementById('introName');
    const pageEl = document.getElementById('pageLayer');
    const canvas = document.getElementById('introCanvas');
    const homeName = document.getElementById('homeName');

    const gl = canvas.getContext('webgl', {
      antialias: true,
      alpha: false,
      premultipliedAlpha: false
    });

    if (!gl) {
      introEl.style.display = 'none';
      pageEl.style.opacity = '1';
      return;
    }

    let W = window.innerWidth;
    let H = window.innerHeight;
    let DPR = Math.min(window.devicePixelRatio || 1, 1.5);

    function syncIntroNamePosition() {
      const rect = homeName.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      nameEl.style.left = `${cx}px`;
      nameEl.style.top = `${cy}px`;
      nameEl.style.transform = 'translate(-50%, -50%) scale(0.92)';
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 1.5);

      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';

      gl.viewport(0, 0, canvas.width, canvas.height);
      syncIntroNamePosition();
    }

    resize();
    window.addEventListener('resize', resize);

    const VS = `
      attribute vec2 a_pos;
      varying vec2 v_uv;

      void main() {
        v_uv = a_pos * 0.5 + 0.5;
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }
    `;

    const FS = `
      precision highp float;
      varying vec2 v_uv;

      uniform vec2  u_res;
      uniform float u_time;
      uniform float u_progress;
      uniform float u_fade;
      uniform float u_aspect;

      #define SAMPLES 56

      float saturate(float x) {
        return clamp(x, 0.0, 1.0);
      }

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);

        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));

        vec2 u = f * f * (3.0 - 2.0 * f);

        return mix(a, b, u.x)
             + (c - a) * u.y * (1.0 - u.x)
             + (d - b) * u.x * u.y;
      }

      vec2 catmull(vec2 p0, vec2 p1, vec2 p2, vec2 p3, float t) {
        float t2 = t * t;
        float t3 = t2 * t;
        return 0.5 * (
          (2.0 * p1) +
          (-p0 + p2) * t +
          (2.0*p0 - 5.0*p1 + 4.0*p2 - p3) * t2 +
          (-p0 + 3.0*p1 - 3.0*p2 + p3) * t3
        );
      }

      vec2 pathPoint(float t) {
        vec2 p0 = vec2(-1.08,  1.02); // top left
        vec2 p1 = vec2(-0.86, -0.22); // middle bottom left
        vec2 p2 = vec2( 0.34, -0.18); // middle bottom right
        vec2 p3 = vec2( 0.92,  0.78); // right top
        vec2 p4 = vec2( 0.00,  0.16); // middle

        if (t < 0.25) {
          float s = t / 0.25;
          return catmull(p0, p0, p1, p2, s);
        } else if (t < 0.56) {
          float s = (t - 0.25) / 0.31;
          return catmull(p0, p1, p2, p3, s);
        } else if (t < 0.80) {
          float s = (t - 0.56) / 0.24;
          return catmull(p1, p2, p3, p4, s);
        } else {
          float s = (t - 0.80) / 0.20;
          return catmull(p2, p3, p4, p4, s);
        }
      }

      vec2 pathTangent(float t) {
        float e = 0.01;
        vec2 a = pathPoint(max(0.0, t - e));
        vec2 b = pathPoint(min(1.0, t + e));
        return normalize(b - a + vec2(0.0001));
      }

      vec2 flowWarp(vec2 p, float t) {
        float n1 = noise(p * 1.7 + vec2(t * 0.08, -t * 0.05));
        float n2 = noise(p * 3.4 + vec2(-t * 0.10, t * 0.07));
        float n3 = noise(p * 6.2 + vec2(t * 0.03, t * 0.04));

        p.x += (n1 - 0.5) * 0.045;
        p.y += (n2 - 0.5) * 0.035;
        p += vec2(
          sin(p.y * 4.5 + t * 1.0) * 0.010,
          sin(p.x * 3.6 - t * 0.8) * 0.009
        );
        p += (n3 - 0.5) * 0.010;

        return p;
      }

      float currentField(vec2 p, float head, float lag, float widthMul, float sideOffset, float softness) {
        float d = 10.0;
        float effectiveHead = max(0.0, head - lag);

        for (int i = 0; i < SAMPLES; i++) {
          float t = float(i) / float(SAMPLES - 1);

          if (t > effectiveHead) {
            continue;
          }

          vec2 q = pathPoint(t);
          vec2 tanDir = pathTangent(t);
          vec2 nrm = vec2(-tanDir.y, tanDir.x);

          float localWave =
              sin(t * 18.0 - u_time * 1.7) * 0.018 +
              sin(t * 31.0 + u_time * 1.1) * 0.010;

          q += nrm * (sideOffset + localWave);
          q.x *= u_aspect;

          float trail = 1.0 - saturate((effectiveHead - t) / max(effectiveHead + 0.0001, 0.0001));
          float width = mix(0.020, 0.085, pow(trail, 0.85)) * widthMul;

          width *= 1.0 + 0.18 * sin(t * 22.0 - u_time * 2.1);
          width *= 1.0 + 0.10 * sin(t * 37.0 + u_time * 1.6);

          float dist = length(p - q) - width;
          d = smin(d, dist, softness);
        }

        return d;
      }

      float scene(vec2 uv) {
        vec2 p = uv;
        p.x *= u_aspect;
        p = flowWarp(p, u_time);

        float head = u_progress;

        float mainFlow   = currentField(p, head, 0.00, 1.00,  0.000, 0.060);
        float trailA     = currentField(p, head, 0.08, 0.72,  0.030, 0.050);
        float trailB     = currentField(p, head, 0.15, 0.58, -0.040, 0.045);
        float whisper    = currentField(p, head, 0.23, 0.38,  0.020, 0.035);

        float d = smin(mainFlow, trailA, 0.070);
        d = smin(d, trailB, 0.060);
        d = smin(d, whisper, 0.050);

        vec2 headPos = pathPoint(head);
        headPos.x *= u_aspect;

        float headBloom = length(p - headPos) - 0.095;
        d = smin(d, headBloom, 0.11);

        return d;
      }

      vec3 chromeShade(vec2 uv, vec2 n, float d) {
        vec3 viewDir = normalize(vec3(0.0, 0.0, 1.0));
        vec3 normal = normalize(vec3(-n.x * 0.95, -n.y * 0.95, 0.78));

        vec3 lightA = normalize(vec3(-0.72, 0.72, 0.92));
        vec3 lightB = normalize(vec3( 0.92, 0.08, 0.58));
        vec3 lightC = normalize(vec3(-0.14,-0.92, 0.26));

        float diffA = max(dot(normal, lightA), 0.0);
        float diffB = max(dot(normal, lightB), 0.0);
        float diffC = max(dot(normal, lightC), 0.0);

        vec3 refl = reflect(-viewDir, normal);

        float bands =
            0.42
          + 0.22 * sin(refl.y * 14.0 + refl.x * 6.0)
          + 0.12 * sin(refl.y * 27.0 - refl.x * 10.0)
          + 0.07 * sin(refl.x * 41.0 + refl.y * 12.0);

        bands = saturate(bands);

        float specA = pow(max(dot(normalize(lightA + viewDir), normal), 0.0), 120.0);
        float specB = pow(max(dot(normalize(lightB + viewDir), normal), 0.0), 84.0);
        float specC = pow(max(dot(normalize(lightC + viewDir), normal), 0.0), 34.0);

        float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

        vec3 shadow = vec3(0.018, 0.020, 0.024);
        vec3 mid    = vec3(0.40, 0.43, 0.47);
        vec3 bright = vec3(0.92, 0.94, 0.97);

        vec3 col = mix(shadow, mid, bands);
        col = mix(col, bright, diffA * 0.72 + diffB * 0.34 + diffC * 0.10);

        col += specA * vec3(1.0) * 0.72;
        col += specB * vec3(0.96, 0.98, 1.0) * 0.58;
        col += specC * vec3(0.74, 0.80, 0.88) * 0.20;
        col += fresnel * vec3(0.18, 0.20, 0.24) * 0.55;

        float liquidStreak =
            0.5 + 0.5 * sin((uv.x * 18.0 - uv.y * 9.0) - u_time * 2.0) *
            (0.5 + 0.5 * sin((uv.x * 35.0 + uv.y * 7.0) + u_time * 1.3));

        col *= mix(0.94, 1.08, liquidStreak);

        float edgeGlow = 1.0 - smoothstep(-0.035, 0.015, d);
        col += edgeGlow * vec3(0.10, 0.105, 0.115);

        return col;
      }

      void main() {
        vec2 uv = v_uv * 2.0 - 1.0;
        uv.y *= u_res.y / u_res.x;

        float d = scene(uv);

        float alpha = 1.0 - smoothstep(0.020, 0.090, d);
        if (alpha < 0.001) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }

        float dx = scene(uv + vec2(0.0025, 0.0)) - d;
        float dy = scene(uv + vec2(0.0, 0.0025)) - d;
        vec2 n = normalize(vec2(dx, dy) + vec2(0.0001));

        vec3 col = chromeShade(uv, n, d);

        float core = 1.0 - smoothstep(-0.045, 0.010, d);
        col += core * vec3(0.06, 0.065, 0.07);

        col *= (1.0 - u_fade);
        alpha *= (1.0 - u_fade);

        gl_FragColor = vec4(col, alpha + (1.0 - alpha));
      }
    `;

    function compile(type, src) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }

      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(program);
    gl.useProgram(program);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(
      gl.ARRAY_BUFFER,
      new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
      gl.STATIC_DRAW
    );

    const aPos = gl.getAttribLocation(program, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(program, 'u_res');
    const uTime = gl.getUniformLocation(program, 'u_time');
    const uProgress = gl.getUniformLocation(program, 'u_progress');
    const uFade = gl.getUniformLocation(program, 'u_fade');
    const uAspect = gl.getUniformLocation(program, 'u_aspect');

    let animId = null;
    let startTime = null;

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutExpo(t) {
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

    const FLOW_END  = 3200;
    const NAME_AT   = 2650;
    const PAGE_AT   = 3000;
    const FADE_AT   = 3900;
    const END_AT    = 5200;

    function render(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const sec = elapsed / 1000;

      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      const progress = easeInOutCubic(clamp(elapsed / FLOW_END, 0, 1));
      const fade = easeOutExpo(clamp((elapsed - FADE_AT) / (END_AT - FADE_AT), 0, 1));

      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, sec);
      gl.uniform1f(uProgress, progress);
      gl.uniform1f(uFade, fade);
      gl.uniform1f(uAspect, canvas.width / canvas.height);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      if (elapsed > NAME_AT) {
        nameEl.classList.add('show');
        nameEl.style.transform = 'translate(-50%, -50%) scale(1)';
      }

      if (elapsed > PAGE_AT) {
        const pageProgress = clamp((elapsed - PAGE_AT) / (END_AT - PAGE_AT), 0, 1);
        pageEl.style.opacity = String(easeOutExpo(pageProgress));
      }

      if (elapsed > FADE_AT) {
        const bgFade = clamp((elapsed - FADE_AT) / (END_AT - FADE_AT), 0, 1);
        introEl.style.background = `rgba(0,0,0,${(1 - easeOutExpo(bgFade)).toFixed(3)})`;
      }

      if (elapsed >= END_AT) {
        introEl.style.display = 'none';
        cancelAnimationFrame(animId);
        return;
      }

      animId = requestAnimationFrame(render);
    }

    function startIntro() {
      syncIntroNamePosition();
      startTime = null;
      nameEl.classList.remove('show');
      nameEl.style.transform = 'translate(-50%, -50%) scale(0.92)';
      introEl.style.display = 'block';
      introEl.style.background = '#000';
      pageEl.style.opacity = '0';

      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(render);
    }

    startIntro();
    homeName.addEventListener('click', startIntro);
  })();

  // ── SCROLL REVEAL ──
  const revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
  const observer  = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => observer.observe(el));
  </script>
</body>
</html>
